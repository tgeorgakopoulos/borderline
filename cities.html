<title>Borderline — Cities</title>
<meta name="description" content="Pinpoint 200 famous world cities — the closer you tap, the more points. Part of Borderline geography games.">

<style>
  :root {
    --paper: #F4F0E8; --ink: #002147; --muted: #6B6459; --line: #C9C2B8;
    --sea: #E7E1D3; --crimson: #A50021; --marigold: #FDB94E; --butter: #FDE169;
    --good: #1D7A44; --good-soft: #BFE0C8; --bad: #A50021; --bad-soft: #EEC3CA;
    --serif: 'Fraunces', Georgia, serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  @supports (height: 100dvh) { body { height: 100dvh; } }
  body {
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--paper); color: var(--ink); display: flex; flex-direction: column;
  }
  #lang-toggle {
    position: absolute; top: 14px; right: 14px; z-index: 20; display: flex;
    border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
    background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .lang-btn { border: none; background: #fff; color: var(--muted); padding: 7px 13px;
    font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .lang-btn.active { background: var(--ink); color: var(--paper); }

  #map-wrap { flex: 1; position: relative; min-height: 0; }
  #map { width: 100%; height: 100%; display: block; touch-action: none; }
  #hud {
    display: none; position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    z-index: 5; align-items: center; gap: 16px; padding: 9px 18px;
    background: rgba(255,255,255,.96); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08); max-width: 94%;
  }
  #hud.on { display: flex; }
  #prompt { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  #tcty { font-size: 12.5px; color: var(--muted); margin-left: 6px; font-family: inherit; font-weight: 500; }
  #target { font-family: var(--serif); font-weight: 700; font-size: clamp(17px,3vw,25px); white-space: nowrap; }
  #counter { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  #pts { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  #pts b { color: var(--ink); font-size: 15px; }

  #zoomers { position: absolute; right: 14px; bottom: 18px; display: none; flex-direction: column; gap: 6px; }
  #zoomers.on { display: flex; }
  #zoomers button { width: 42px; height: 42px; border: 1px solid var(--line); background: #fff;
    border-radius: 10px; font-size: 20px; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  #toast { position: absolute; left: 50%; top: 74px; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 9px 18px; border-radius: 10px; font-size: 15px;
    opacity: 0; pointer-events: none; transition: opacity .25s; max-width: 90%; text-align: center; }
  #toast.show { opacity: 1; }
  #toast.good { background: var(--good); } #toast.bad { background: var(--bad); }

  .screen { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(244,240,232,.98); z-index: 10; overflow-y: auto; }
  .screen.active { display: flex; }
  .panel { max-width: 560px; width: 92%; text-align: center; padding: 32px 8px; }
  h1 { font-family: var(--serif); font-weight: 900; letter-spacing: -1px; font-size: clamp(38px,7.5vw,64px); line-height: 1; }
  .brand-rule { border-top: 3px dashed var(--crimson); width: 100vw; margin: 18px 0 14px calc(50% - 50vw); }
  .tagline { font-size: 13px; letter-spacing: 4px; text-transform: uppercase; opacity: .75; margin-bottom: 26px; }
  .row-label { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .pill-row { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
  .pill { border: 1.5px solid rgba(0,33,71,.35); background: #fff; border-radius: 999px;
    padding: 8px 16px; font-size: 14px; cursor: pointer; color: var(--ink); font-family: inherit; }
  .pill.active { border-color: var(--ink); color: var(--paper); font-weight: 700; background: var(--ink); }
  .pill .cnt { margin-left: 6px; font-size: 12px; opacity: .85; }
  .mode-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; margin-bottom: 18px; }
  .mode-btn { border: 2px solid var(--ink); background: #fff; border-radius: 10px; padding: 16px 14px;
    cursor: pointer; text-align: left; font-family: inherit; transition: border-color .15s, box-shadow .15s, transform .1s; }
  .mode-btn .m-title { font-family: var(--serif); font-size: 19px; font-weight: 600; margin-bottom: 3px; }
  .mode-btn .m-desc { font-size: 13px; color: var(--muted); }
  .mode-btn[data-mode="survival"] { background: var(--crimson); border-color: var(--crimson); }
  .mode-btn[data-mode="survival"] .m-title { color: var(--butter); }
  .mode-btn[data-mode="survival"] .m-desc { color: var(--paper); }
  .big-score { font-family: var(--serif); font-size: 56px; font-weight: 900; color: var(--crimson); margin: 8px 0 2px; }
  .sub { color: var(--muted); font-size: 16px; margin-bottom: 20px; }
  .stats { display: flex; justify-content: center; gap: 26px; margin: 16px 0 20px; font-size: 13px; color: var(--muted); }
  .stats b { display: block; font-family: var(--serif); font-size: 21px; color: var(--ink); }
  #misses { text-align: left; font-size: 14px; max-height: 190px; overflow-y: auto; border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 14px; margin-bottom: 20px; background: #fff; }
  #misses div { padding: 3px 0; color: var(--muted); }
  #misses b { color: var(--ink); }
  .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .primary-btn { background: var(--ink); color: var(--paper); border: none; border-radius: 10px;
    padding: 12px 22px; font-size: 15px; cursor: pointer; font-family: inherit; }
  .ghost-btn { background: #fff; color: var(--ink); border: 1.5px solid var(--line); border-radius: 10px;
    padding: 12px 22px; font-size: 15px; cursor: pointer; font-family: inherit; }
  .colophon { margin-top: 26px; font-size: 12px; color: var(--muted); display: flex; gap: 8px;
    justify-content: center; align-items: center; flex-wrap: wrap; }
  .colophon a { color: var(--crimson); text-decoration: none; }
  .colophon .dot { opacity: .5; }
  #loading { color: var(--muted); font-size: 16px; }
  @media (max-width: 620px) {
    #lang-toggle { top: 10px; right: 10px; }
    .lang-btn { padding: 6px 11px; font-size: 12px; }
    .screen .panel { padding-top: 66px; }
  }
  /* hover only where a real pointer exists — on touch, :hover sticks after a tap */
  @media (hover: hover) and (pointer: fine) {
    .colophon a:hover { text-decoration: underline; }
    .mode-btn:hover { border-color: var(--crimson); box-shadow: 0 3px 12px rgba(165,0,33,.16); transform: translateY(-1px); }
    .ghost-btn:hover { border-color: var(--ink); }
  }
</style>
</head>
<body>

<div id="lang-toggle">
  <button class="lang-btn" data-lang="en">EN</button>
  <button class="lang-btn" data-lang="el">ΕΛ</button>
</div>

<div id="map-wrap">
  <svg id="map"></svg>
  <div id="hud">
    <div><div id="prompt"></div><div id="target">—</div></div>
    <div id="counter"></div>
    <div id="pts"><span data-i18n="points">Points</span> <b id="score">0</b></div>
  </div>
  <div id="zoomers">
    <button id="zin" aria-label="Zoom in">+</button>
    <button id="zout" aria-label="Zoom out">−</button>
    <button id="zreset" aria-label="Reset" style="font-size:14px">⌂</button>
  </div>
  <div id="toast"></div>

  <div class="screen active" id="menu-screen">
    <div class="panel">
      <h1 data-i18n="title">Cities</h1>
      <div class="brand-rule"></div>
      <p class="tagline" data-i18n="tagline">Pinpoint the city</p>
      <div id="loading" data-i18n="loading">Loading the world map…</div>
      <div id="menu-body" style="display:none">
        <p class="row-label" data-i18n="lblWhere">Where</p>
        <div class="pill-row" id="grp-row">
          <button class="pill" data-grp="all"><span class="l"></span><span class="cnt"></span></button>
          <button class="pill" data-grp="eu"><span class="l"></span><span class="cnt"></span></button>
          <button class="pill" data-grp="as"><span class="l"></span><span class="cnt"></span></button>
          <button class="pill" data-grp="af"><span class="l"></span><span class="cnt"></span></button>
          <button class="pill" data-grp="am"><span class="l"></span><span class="cnt"></span></button>
        </div>
        <p class="row-label" data-i18n="lblDiff">Difficulty</p>
        <div class="pill-row" id="diff-row">
          <button class="pill" data-diff="1"><span class="l"></span><span class="cnt"></span></button>
          <button class="pill" data-diff="2"><span class="l"></span><span class="cnt"></span></button>
          <button class="pill" data-diff="all"><span class="l"></span><span class="cnt"></span></button>
        </div>
        <div class="mode-grid">
          <button class="mode-btn" data-mode="10"><div class="m-title" data-i18n="m10">Quick</div><div class="m-desc" data-i18n="m10d">10 random cities</div></button>
          <button class="mode-btn" data-mode="20"><div class="m-title" data-i18n="m20">Classic</div><div class="m-desc" data-i18n="m20d">20 random cities</div></button>
          <button class="mode-btn" data-mode="marathon"><div class="m-title" data-i18n="mMara">Marathon</div><div class="m-desc" id="mara-desc"></div></button>
          <button class="mode-btn" data-mode="survival"><div class="m-title" data-i18n="mSurv">Survival ∞</div><div class="m-desc"><span data-i18n="mSurvD">Until your first miss. Best: </span><span id="hiscore">0</span></div></button>
        </div>
        <p class="colophon">
          <a href="index.html" data-i18n="allGames">← All games</a>
          <span class="dot">·</span><span data-i18n="copyright">© 2026 Social Capital - Borderline</span>
        </p>
      </div>
    </div>
  </div>

  <div class="screen" id="results-screen">
    <div class="panel">
      <h1 style="font-size:clamp(28px,5vw,40px)" id="res-title">Results</h1>
      <div class="big-score" id="final-score">0</div>
      <div class="sub" id="final-sub"></div>
      <div class="stats">
        <div><b id="r-hits">—</b><span data-i18n="onTarget">On target</span></div>
        <div><b id="r-dist">—</b><span data-i18n="medDist">Median miss</span></div>
        <div><b id="r-streak">—</b><span data-i18n="streak">Best streak</span></div>
      </div>
      <div id="misses"></div>
      <div class="btn-row">
        <button class="primary-btn" id="again-btn" data-i18n="again">Play again</button>
        <button class="ghost-btn" id="menu-btn" data-i18n="change">Change mode</button>
      </div>
      <p class="colophon"><a href="index.html" data-i18n="allGames">← All games</a></p>
    </div>
  </div>
</div>

  const polysOf = f => !f || !f.geometry ? [] : f.geometry.type === "Polygon" ? [f.geometry.coordinates]
    : f.geometry.type === "MultiPolygon" ? f.geometry.coordinates : [];
  // the part of a country around the city: drops far-away territories (Alaska, Hawaii, French Guiana, Svalbard…)
  function localGeom(f, lon, lat) {
    const polys = polysOf(f).map(c => {
      const g = { type: "Polygon", coordinates: c };
      let a = d3.geoArea(g); a = Math.min(a, 4 * Math.PI - a);
      let near = Infinity;
      if (d3.geoContains(g, [lon, lat])) near = 0;
      else for (const pt of c[0]) { const d = d3.geoDistance(pt, [lon, lat]); if (d < near) near = d; }
      return { c, g, a, near: near * R_EARTH, cen: d3.geoCentroid(g) };
    });
    if (!polys.length) return null;
    // main landmass = the largest piece within 150 km of the city (cities on small islands, e.g. Montreal, Miami, Hong Kong)
    const close = polys.filter(p => p.near <= 150);
    let main = close.length ? close.reduce((a, b) => b.a > a.a ? b : a)
      : polys.reduce((a, b) => b.near < a.near ? b : a);
    // …and if the country's biggest landmass is within 800 km, centre on that instead (Ushuaia → Argentina, not just Tierra del Fuego)
    const biggest = polys.reduce((a, b) => b.a > a.a ? b : a);
    if (biggest !== main && biggest.near <= 800) main = biggest;
    const b = d3.geoBounds(main.g);
    const rad = Math.max(...[[b[0][0], b[0][1]], [b[1][0], b[1][1]], [b[0][0], b[1][1]], [b[1][0], b[0][1]]]
      .map(p => d3.geoDistance(main.cen, p))) * R_EARTH;
    const D = Math.max(1000, rad * 1.05);
    const keep = polys.filter(p => d3.geoDistance(p.cen, main.cen) * R_EARTH <= D);
    return { type: "Feature", geometry: { type: "MultiPolygon", coordinates: keep.map(p => p.c) } };
  }
  function spanKm(geo) {
    const b = d3.geoBounds(geo);
    const midLat = (b[0][1] + b[1][1]) / 2;
    const dLon = ((b[1][0] - b[0][0]) + 360) % 360 || 0.01;
    const wKm = dLon * 111.32 * Math.cos(midLat * Math.PI / 180), hKm = (b[1][1] - b[0][1]) * 110.6;
    return Math.max(wKm, hKm);
  }
  function boxPoints(lon0, lat0, lon1, lat1) {
    const pts = [];
    for (let k = 0; k <= 8; k++) {
      const x = lon0 + (lon1 - lon0) * k / 8, y = lat0 + (lat1 - lat0) * k / 8;
      pts.push([x, lat0], [x, lat1], [lon0, y], [lon1, y]);
    }
    return { type: "MultiPoint", coordinates: pts };
  }

  // ---------- which map each city gets ----------
  function makeView(c) {
    const lat = c[3], lon = c[4], scope = c[6];
    if (scope === "K") return { center: [12, 54], fit: boxPoints(-24, 35, 44, 70), hl: null, span: 4500 };
    const f = byName[c[2]];
    const local = f ? localGeom(f, lon, lat) : null;
    if (scope === "C" && local) {
      return { center: d3.geoCentroid(local), fit: local, hl: c[2], local, span: Math.max(250, spanKm(local)) };
    }
    // region: the country and its surroundings, not centred exactly on it
    const cen = local ? d3.geoCentroid(local) : [lon, lat];
    const span = Math.min(6000, Math.max(1600, (local ? spanKm(local) : 0) * 1.6));
    let center = cen;
    for (let k = 0; k < 12; k++) {
      const j = span * 0.18 / 110.6;
      const cy = cen[1] + (Math.random() * 2 - 1) * j;
      const cx = cen[0] + (Math.random() * 2 - 1) * j / Math.max(0.2, Math.cos(cy * Math.PI / 180));
      if (d3.geoDistance([cx, cy], [lon, lat]) * R_EARTH <= span * 0.36) { center = [cx, cy]; break; }
    }
    return { center, fitSpan: span, hl: null, span };
  }

  function layout() {
    const wrap = document.getElementById("map-wrap");
    const w = wrap.clientWidth, h = wrap.clientHeight;
    svg.attr("viewBox", "0 0 " + w + " " + h).attr("width", w).attr("height", h);
    if (!ready || !w || !h) return;
    const top = playing ? 84 : 16, pad = 16;
    const availW = w - 2 * pad, availH = h - top - pad;
    if (availW <= 0 || availH <= 0) return;
    const v = view || makeView(["", "", "", 50, 10, 1, "K"]);
    projection = d3.geoAzimuthalEqualArea().clipAngle(90).rotate([-v.center[0], -v.center[1]]);
    path = d3.geoPath(projection);
    if (v.fit) projection.fitExtent([[pad + 14, top + 14], [w - pad - 14, h - pad - 14]], v.fit);
    else {
      projection.scale(Math.min(availW, availH) / (v.fitSpan / R_EARTH));
      projection.translate([pad + availW / 2, top + availH / 2]);
    }
    gBase.selectAll("path").data(feats, d => d.properties.name).join("path")
      .attr("d", path)
      .attr("fill", v.hl ? "#EFEBE2" : "#FBF9F5")
      .attr("stroke", "#B9B1A5").attr("stroke-width", .6)
      .attr("vector-effect", "non-scaling-stroke");
    // highlight only the part of the country being shown (not Alaska on a map for Miami)
    const hlGeo = v.hl ? [v.local, ...(HL_EXTRA[v.hl] || []).map(n => byName[n]).filter(Boolean)] : [];
    gHl.selectAll("path").data(hlGeo).join("path")
      .attr("d", path).attr("fill", "#fff").attr("stroke", "#002147").attr("stroke-width", 1.2)
      .attr("vector-effect", "non-scaling-stroke");
    // lakes sit on top: the country shapes don't have them cut out (Great Lakes, Victoria, Baikal…)
    gLakes.selectAll("path").data(lakes).join("path")
      .attr("d", path).attr("fill", "#E7E1D3").attr("stroke", "#B9B1A5").attr("stroke-width", .5)
      .attr("vector-effect", "non-scaling-stroke");
    zoom.translateExtent([[-w * .6, -h * .6], [w * 1.6, h * 1.6]]);
    svg.call(zoom.transform, d3.zoomIdentity);
    marks = []; drawMarks();
  }
  window.addEventListener("resize", layout);

  // marks are stored in map coordinates and redrawn through the current zoom
  function drawMarks() {
    const P = p => curT.apply(p);
    gMarks.selectAll("*").remove();
    for (const m of marks) {
      if (m.type === "line") {
        const a = P(m.a), b = P(m.b);
        gMarks.append("line").attr("x1", a[0]).attr("y1", a[1]).attr("x2", b[0]).attr("y2", b[1])
          .attr("stroke", m.color).attr("stroke-width", 1.8).attr("stroke-dasharray", "4 3");
      } else if (m.type === "guess") {
        const a = P(m.a);
        gMarks.append("circle").attr("cx", a[0]).attr("cy", a[1]).attr("r", 5)
          .attr("fill", "#1e3a8a").attr("stroke", "#fff").attr("stroke-width", 1.5);
      } else if (m.type === "city") {
        const a = P(m.a);
        gMarks.append("rect").attr("x", a[0] - 5.5).attr("y", a[1] - 5.5).attr("width", 11).attr("height", 11)
          .attr("fill", "#FDB94E").attr("stroke", "#002147").attr("stroke-width", 1.6);
      }
    }
  }

  d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json").then(world => {
    feats = topojson.feature(world, world.objects.countries).features
      .filter(f => f.properties.name !== "Antarctica");
    for (const f of feats) byName[f.properties.name] = f;
    ready = true;
    layout();
    document.getElementById("loading").style.display = "none";
    document.getElementById("menu-body").style.display = "block";
    refreshMenu();
    d3.json("https://cdn.jsdelivr.net/gh/martynafford/natural-earth-geojson@master/50m/physical/ne_50m_lakes.json")
      .then(lk => { lakes = lk.features.filter(f => { const a = d3.geoArea(f); return a > 1.5e-5 && a < 1; }); layout(); })
      .catch(() => {});
  }).catch(() => { document.getElementById("loading").textContent = t("loadErr"); });

  document.getElementById("map-wrap").style.background = "var(--sea)";
  d3.select("#zin").on("click", () => svg.transition().duration(250).call(zoom.scaleBy, 1.7));
  d3.select("#zout").on("click", () => svg.transition().duration(250).call(zoom.scaleBy, 1 / 1.7));
  d3.select("#zreset").on("click", () => svg.transition().duration(350).call(zoom.transform, d3.zoomIdentity));

  let toastTimer = null;
  function toast(msg, kind) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.className = "show" + (kind ? " " + kind : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = ""; }, 1900);
  }

  // ---------- state ----------
  let grp = "all", diff = "all", mode = null, playing = false;
  try { grp = localStorage.getItem("ci-grp") || "all"; diff = localStorage.getItem("ci-diff") || "all"; } catch (e) {}
  let hi = 0; try { hi = +(localStorage.getItem("ci-hiscore") || 0); } catch (e) {}
  let queue = [], target = null, i = 0, total = 0, score = 0, streak = 0, best = 0, locked = false, results = [];

  function pool(g, d) {
    return CITIES.filter(c => {
      if (g !== "all" && c[7] !== g) return false;
      if (d === "1") return c[5] === 1;
      if (d === "2") return c[5] <= 2;
      return true;
    });
  }

  function refreshMenu() {
    const gl = { all: t("gAll"), eu: t("gEu"), as: t("gAs"), af: t("gAf"), am: t("gAm") };
    document.querySelectorAll("#grp-row .pill").forEach(b => {
      b.querySelector(".l").textContent = gl[b.dataset.grp];
      b.querySelector(".cnt").textContent = "· " + pool(b.dataset.grp, diff).length;
      b.classList.toggle("active", b.dataset.grp === grp);
    });
    const dl = { "1": t("d1"), "2": t("d2"), all: t("dAll") };
    document.querySelectorAll("#diff-row .pill").forEach(b => {
      b.querySelector(".l").textContent = dl[b.dataset.diff];
      b.querySelector(".cnt").textContent = "· " + pool(grp, b.dataset.diff).length;
      b.classList.toggle("active", b.dataset.diff === diff);
    });
    document.getElementById("mara-desc").textContent = t("maraD")(pool(grp, diff).length);
    document.getElementById("hiscore").textContent = hi;
  }
  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const v = STR[lang][el.dataset.i18n];
      if (typeof v === "string") el.textContent = v;
    });
    document.querySelectorAll(".lang-btn").forEach(b => b.classList.toggle("active", b.dataset.lang === lang));
    if (ready) refreshMenu();
    if (playing && target) showItem(true);
  }
  document.querySelectorAll(".lang-btn").forEach(b => b.addEventListener("click", () => {
    lang = b.dataset.lang; try { localStorage.setItem("geoquiz-lang", lang); } catch (e) {}
    applyLang();
  }));
  document.querySelectorAll("#grp-row .pill").forEach(b => b.addEventListener("click", () => {
    grp = b.dataset.grp; try { localStorage.setItem("ci-grp", grp); } catch (e) {} refreshMenu();
  }));
  document.querySelectorAll("#diff-row .pill").forEach(b => b.addEventListener("click", () => {
    diff = b.dataset.diff; try { localStorage.setItem("ci-diff", diff); } catch (e) {} refreshMenu();
  }));
  document.querySelectorAll(".mode-btn").forEach(b => b.addEventListener("click", () => start(b.dataset.mode)));

  const shuffle = a => { a = a.slice(); for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; };

  function start(m) {
    const list = pool(grp, diff);
    if (!list.length) return;
    mode = m; queue = shuffle(list);
    total = m === "survival" ? 0 : m === "marathon" ? list.length : Math.min(+m, list.length);
    score = 0; i = 0; streak = 0; best = 0; results = []; playing = true;
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById("hud").classList.add("on");
    document.getElementById("zoomers").classList.add("on");
    showItem();
  }

  function showItem(keep) {
    if (!keep) {
      target = queue.pop(); locked = false;
      view = makeView(target);
      layout();
    }
    document.getElementById("prompt").textContent = t("find");
    const tg = document.getElementById("target");
    tg.textContent = label(target);
    const sp = document.createElement("span"); sp.id = "tcty"; sp.textContent = ctyName(target);
    tg.appendChild(sp);
    document.getElementById("counter").textContent =
      mode === "survival" ? t("item") + " " + (i + 1) : t("item") + " " + Math.min(i + 1, total) + " / " + total;
    document.getElementById("score").textContent = score;
  }

  svg.on("click", ev => {
    if (!playing || locked || guard()) return;
    const [x, y] = d3.pointer(ev, gRoot.node());
    const ll = projection.invert([x, y]);
    if (!ll || !isFinite(ll[0]) || !isFinite(ll[1])) return;
    locked = true;
    answer(ll[0], ll[1], x, y);
  });

  function answer(lon, lat, x, y) {
    const km = Math.round(d3.geoDistance([lon, lat], [target[4], target[3]]) * R_EARTH);
    const pts = pointsFor(km, view.span);
    const hit = km <= HIT * view.span;
    score += pts;
    if (hit) { streak++; best = Math.max(best, streak); } else streak = 0;
    results.push({ c: target, km, pts, hit });
    const tp = projection([target[4], target[3]]);
    marks = [{ type: "guess", a: [x, y] }];
    if (tp) marks.push({ type: "line", a: [x, y], b: tp, color: hit ? "#1D7A44" : "#A50021" }, { type: "city", a: tp });
    drawMarks();
    document.getElementById("score").textContent = score;
    toast(pts > 0 ? t("nearBy")(km, pts) : t("missed")(km), hit ? "good" : "bad");
    setTimeout(() => {
      i++;
      if (mode === "survival" && !hit) return end(true);
      if ((mode !== "survival" && i >= total) || !queue.length) return end(false);
      showItem();
    }, hit ? 1500 : 2300);
  }

  function end(died) {
    playing = false; target = null; view = null;
    document.getElementById("hud").classList.remove("on");
    document.getElementById("zoomers").classList.remove("on");
    const hits = results.filter(r => r.hit).length;
    const dists = results.map(r => r.km).sort((a, b) => a - b);
    const med = dists.length ? (dists.length % 2 ? dists[(dists.length - 1) / 2]
      : Math.round((dists[dists.length / 2 - 1] + dists[dists.length / 2]) / 2)) : null;
    document.getElementById("res-title").textContent = mode === "survival" && died ? t("gameOver") : t("results");
    document.getElementById("final-score").textContent = score;
    document.getElementById("r-hits").textContent = hits + " / " + results.length;
    document.getElementById("r-dist").textContent = med === null ? "—" : med + (lang === "el" ? " χλμ" : " km");
    document.getElementById("r-streak").textContent = best;
    let sub;
    if (mode === "survival") {
      if (score > hi) { hi = score; try { localStorage.setItem("ci-hiscore", String(hi)); } catch (e) {} sub = t("newHi"); }
      else sub = t("hi") + hi;
      document.getElementById("hiscore").textContent = hi;
    } else {
      const acc = results.length ? hits / results.length : 0;
      sub = acc === 1 ? t("perfect") : acc >= .7 ? t("great") : acc >= .4 ? t("ok") : t("poor");
    }
    document.getElementById("final-sub").textContent = sub;
    const worst = results.filter(r => !r.hit).sort((a, b) => b.km - a.km).slice(0, 8);
    const box = document.getElementById("misses");
    if (worst.length) {
      box.style.display = "block";
      box.innerHTML = "<div style='color:var(--ink);font-weight:600;padding-bottom:4px'>" + t("missesTitle") + "</div>" +
        worst.map(r => "<div>" + t("mLine")(label(r.c), r.km) + "</div>").join("");
    } else box.style.display = "none";
    document.getElementById("results-screen").classList.add("active");
    layout();
  }

  document.getElementById("again-btn").addEventListener("click", () => start(mode));
  document.getElementById("menu-btn").addEventListener("click", () => {
    document.getElementById("results-screen").classList.remove("active");
    document.getElementById("menu-screen").classList.add("active");
    refreshMenu(); layout();
  });

  applyLang();
  layout();
})();
</script>
</body>
</html>
