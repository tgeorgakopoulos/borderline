<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Borderline — Daily quiz</title>
<meta name="description" content="One geography quiz a day, the same for everyone. Five rounds, twenty seconds each. Part of Borderline geography games.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#002147">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --paper: #F4F0E8; --ink: #002147; --muted: #6B6459; --line: #C9C2B8;
    --sea: #E7E1D3; --crimson: #A50021; --marigold: #FDB94E; --butter: #FDE169;
    --good: #1D7A44; --good-soft: #BFE0C8; --bad: #A50021; --bad-soft: #EEC3CA;
    --serif: 'Fraunces', Georgia, serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  @supports (height: 100dvh) { body { height: 100dvh; } }
  body {
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--paper); color: var(--ink); display: flex; flex-direction: column;
  }
  #lang-toggle {
    position: absolute; top: 14px; right: 14px; z-index: 20; display: flex;
    border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
    background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .lang-btn { border: none; background: #fff; color: var(--muted); padding: 7px 13px;
    font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .lang-btn.active { background: var(--ink); color: var(--paper); }

  #map-wrap { flex: 1; position: relative; min-height: 0; }
  #map { width: 100%; height: 100%; display: block; touch-action: none; }
  #hud {
    display: none; position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    z-index: 5; align-items: center; gap: 16px; padding: 9px 18px;
    background: rgba(255,255,255,.96); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08); max-width: 94%;
  }
  #hud.on { display: flex; }
  #prompt { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  #tcty { font-size: 12.5px; color: var(--muted); margin-left: 6px; font-family: inherit; font-weight: 500; }
  #target { font-family: var(--serif); font-weight: 700; font-size: clamp(17px,3vw,25px); white-space: nowrap; }
  #counter { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  #pts { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  #pts b { color: var(--ink); font-size: 15px; }

  #zoomers { position: absolute; right: 14px; bottom: 18px; display: none; flex-direction: column; gap: 6px; }
  #zoomers.on { display: flex; }
  #zoomers button { width: 42px; height: 42px; border: 1px solid var(--line); background: #fff;
    border-radius: 10px; font-size: 20px; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  #toast { position: absolute; left: 50%; top: 74px; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 9px 18px; border-radius: 10px; font-size: 15px;
    opacity: 0; pointer-events: none; transition: opacity .25s; max-width: 90%; text-align: center; }
  #toast.show { opacity: 1; }
  #toast.good { background: var(--good); } #toast.bad { background: var(--bad); }

  .screen { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(244,240,232,.98); z-index: 10; overflow-y: auto; }
  .screen.active { display: flex; }
  .panel { max-width: 560px; width: 92%; text-align: center; padding: 32px 8px; }
  h1 { font-family: var(--serif); font-weight: 900; letter-spacing: -1px; font-size: clamp(38px,7.5vw,64px); line-height: 1; }
  .brand-rule { border-top: 3px dashed var(--crimson); width: 100vw; margin: 18px 0 14px calc(50% - 50vw); }
  .tagline { font-size: 13px; letter-spacing: 4px; text-transform: uppercase; opacity: .75; margin-bottom: 26px; }
  .row-label { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .pill-row { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
  .pill { border: 1.5px solid rgba(0,33,71,.35); background: #fff; border-radius: 999px;
    padding: 8px 16px; font-size: 14px; cursor: pointer; color: var(--ink); font-family: inherit; }
  .pill.active { border-color: var(--ink); color: var(--paper); font-weight: 700; background: var(--ink); }
  .pill .cnt { margin-left: 6px; font-size: 12px; opacity: .85; }
  .mode-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; margin-bottom: 18px; }
  .mode-btn { border: 2px solid var(--ink); background: #fff; border-radius: 10px; padding: 16px 14px;
    cursor: pointer; text-align: left; font-family: inherit; transition: border-color .15s, box-shadow .15s, transform .1s; }
  .mode-btn .m-title { font-family: var(--serif); font-size: 19px; font-weight: 600; margin-bottom: 3px; }
  .mode-btn .m-desc { font-size: 13px; color: var(--muted); }
  .mode-btn[data-mode="survival"] { background: var(--crimson); border-color: var(--crimson); }
  .mode-btn[data-mode="survival"] .m-title { color: var(--butter); }
  .mode-btn[data-mode="survival"] .m-desc { color: var(--paper); }
  .big-score { font-family: var(--serif); font-size: 56px; font-weight: 900; color: var(--crimson); margin: 8px 0 2px; }
  .sub { color: var(--muted); font-size: 16px; margin-bottom: 20px; }
  .stats { display: flex; justify-content: center; gap: 26px; margin: 16px 0 20px; font-size: 13px; color: var(--muted); }
  .stats b { display: block; font-family: var(--serif); font-size: 21px; color: var(--ink); }
  #misses { text-align: left; font-size: 14px; max-height: 190px; overflow-y: auto; border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 14px; margin-bottom: 20px; background: #fff; }
  #misses div { padding: 3px 0; color: var(--muted); }
  #misses b { color: var(--ink); }
  .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .primary-btn { background: var(--ink); color: var(--paper); border: none; border-radius: 10px;
    padding: 12px 22px; font-size: 15px; cursor: pointer; font-family: inherit; }
  .ghost-btn { background: #fff; color: var(--ink); border: 1.5px solid var(--line); border-radius: 10px;
    padding: 12px 22px; font-size: 15px; cursor: pointer; font-family: inherit; }
  .colophon { margin-top: 26px; font-size: 12px; color: var(--muted); display: flex; gap: 8px;
    justify-content: center; align-items: center; flex-wrap: wrap; }
  .colophon a { color: var(--crimson); text-decoration: none; }
  .colophon .dot { opacity: .5; }
  #loading { color: var(--muted); font-size: 16px; }
  @media (max-width: 620px) {
    #lang-toggle { top: 10px; right: 10px; }
    .lang-btn { padding: 6px 11px; font-size: 12px; }
    .screen .panel { padding-top: 66px; }
  }
  /* hover only where a real pointer exists — on touch, :hover sticks after a tap */
  @media (hover: hover) and (pointer: fine) {
    .colophon a:hover { text-decoration: underline; }
    .mode-btn:hover { border-color: var(--crimson); box-shadow: 0 3px 12px rgba(165,0,33,.16); transform: translateY(-1px); }
    .ghost-btn:hover { border-color: var(--ink); }
  }

  #timer { position: absolute; left: 0; right: 0; bottom: -7px; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
  #timer i { display: block; height: 100%; width: 100%; background: var(--ink); transform-origin: left; }
  #timer.low i { background: var(--crimson); }
  #hud { position: absolute; }
  #round-tag { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--crimson); font-weight: 700; white-space: nowrap; }
  #panel { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(560px, 94%);
    background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 4px 18px rgba(0,0,0,.12);
    padding: 14px 16px; z-index: 6; display: none; text-align: center; }
  #panel.on { display: block; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .choice { border: 1.5px solid var(--ink); background: #fff; border-radius: 10px; padding: 12px 8px; font-size: 16px;
    cursor: pointer; font-family: inherit; color: var(--ink); }
  .choice.right { background: var(--good); border-color: var(--good); color: #fff; }
  .choice.wrong { background: var(--bad); border-color: var(--bad); color: #fff; }
  .choice:disabled { cursor: default; }
  .typed { display: flex; gap: 8px; margin-top: 10px; }
  .typed input { flex: 1; min-width: 0; font-size: 17px; padding: 11px 12px; border: 1.5px solid var(--ink); border-radius: 10px; font-family: inherit; }
  .fb-line { font-size: 16px; margin-bottom: 10px; }
  .fb-line b { font-family: var(--serif); font-size: 20px; }
  .fb-good { color: var(--good); } .fb-bad { color: var(--bad); }
  .q-line { font-size: 15px; color: var(--muted); }
  .q-line b { color: var(--ink); font-family: var(--serif); font-size: 21px; }
  .rules { text-align: left; display: inline-block; font-size: 15px; line-height: 1.75; margin: 4px 0 22px; color: var(--ink); }
  .rules span { color: var(--crimson); font-weight: 700; margin-right: 6px; }
  .daynum { font-family: var(--serif); font-size: 22px; font-weight: 700; margin-bottom: 2px; }
  .daydate { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
  .banner { background: var(--butter); color: var(--ink); border-radius: 10px; padding: 8px 12px; font-size: 14px; margin-bottom: 16px; display: none; }
  .rows { text-align: left; border: 1px solid var(--line); border-radius: 10px; background: #fff; margin: 6px 0 18px; }
  .rows div { display: flex; justify-content: space-between; gap: 10px; padding: 9px 14px; border-top: 1px solid #EEE9E0; font-size: 14px; }
  .rows div:first-child { border-top: none; }
  .rows .it { color: var(--muted); } .rows .it b { color: var(--ink); }
  .rows .pt { font-weight: 700; white-space: nowrap; }
  .emoji { font-size: 26px; letter-spacing: 3px; margin: 2px 0 12px; }
  .next-in { color: var(--muted); font-size: 14px; margin: 16px 0 6px; }
  .next-in b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .prev { margin-top: 18px; }
  .prev a { display: inline-block; margin: 4px; padding: 7px 12px; border: 1.5px solid var(--line); border-radius: 999px;
    font-size: 13px; color: var(--ink); text-decoration: none; background: #fff; }
  .prev a.done { border-color: var(--ink); }
  .soon-note { font-size: 13px; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 10px; margin-bottom: 16px; }
</style>
</head>
<body>

<div id="lang-toggle">
  <button class="lang-btn" data-lang="en">EN</button>
  <button class="lang-btn" data-lang="el">ΕΛ</button>
</div>

<div id="map-wrap">
  <svg id="map"></svg>
  <div id="hud">
    <div id="round-tag"></div>
    <div><div id="prompt"></div><div id="target">—</div></div>
    <div id="pts"><span data-i18n="points">Points</span> <b id="score">0</b></div>
    <div id="timer"><i></i></div>
  </div>
  <div id="zoomers">
    <button id="zin" aria-label="Zoom in">+</button>
    <button id="zout" aria-label="Zoom out">−</button>
    <button id="zreset" aria-label="Reset" style="font-size:14px">⌂</button>
  </div>
  <div id="panel"></div>

  <div class="screen active" id="intro-screen">
    <div class="panel">
      <h1 data-i18n="title">Daily quiz</h1>
      <div class="brand-rule"></div>
      <div class="banner" id="intro-banner"></div>
      <div class="daynum" id="intro-num"></div>
      <div class="daydate" id="intro-date"></div>
      <div id="loading" data-i18n="loading">Loading the world map…</div>
      <div id="intro-body" style="display:none">
        <div class="rules" id="rules"></div>
        <div class="btn-row"><button class="primary-btn" id="play-btn" data-i18n="play">Play today's quiz</button></div>
        <div class="prev" id="intro-prev"></div>
      </div>
      <p class="colophon">
        <a href="index.html" data-i18n="allGames">← All games</a>
        <span class="dot">·</span><span data-i18n="copyright">© 2026 Social Capital - Borderline</span>
      </p>
    </div>
  </div>

  <div class="screen" id="results-screen">
    <div class="panel">
      <div class="banner" id="res-banner"></div>
      <div class="daynum" id="res-num"></div>
      <div class="big-score" id="res-score">0</div>
      <div class="emoji" id="res-emoji"></div>
      <div class="rows" id="res-rows"></div>
      <div class="soon-note" id="res-compare" data-i18n="compareSoon">Coming soon: see how you rank against everyone who played today.</div>
      <div class="btn-row">
        <button class="primary-btn" id="share-btn" data-i18n="share">Share result</button>
      </div>
      <div class="stats">
        <div><b id="st-played">0</b><span data-i18n="stPlayed">Played</span></div>
        <div><b id="st-streak">0</b><span data-i18n="stStreak">Streak</span></div>
        <div><b id="st-total">0</b><span data-i18n="stTotal">All-time points</span></div>
      </div>
      <div class="next-in" id="next-in"></div>
      <div class="prev" id="res-prev"></div>
      <p class="colophon"><a href="index.html" data-i18n="allGames">← All games</a></p>
    </div>
  </div>
</div>

    const b = $("share-btn"), old = b.textContent; b.textContent = t("copied"); setTimeout(() => { b.textContent = old; }, 2200);
  });

  // ---------- language ----------
  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => { const v = STR[lang][el.dataset.i18n]; if (typeof v === "string") el.textContent = v; });
    document.querySelectorAll(".lang-btn").forEach(b => b.classList.toggle("active", b.dataset.lang === lang));
    if (!ready) return;
    if (ri >= 0) {
      setPrompt();
      $("round-tag").textContent = t("round")(ri + 1);
      if (inRound && rounds[ri].type === "capital") showCapitalPanel(rounds[ri]);
      else if (revealed) feedback(results[ri]);
    } else if ($("results-screen").classList.contains("active")) showResults();
    else renderIntro();
  }
  document.querySelectorAll(".lang-btn").forEach(b => b.addEventListener("click", () => {
    lang = b.dataset.lang; try { localStorage.setItem("geoquiz-lang", lang); } catch (e) {}
    applyLang();
  }));
  applyLang();
  layout();
})();
</script>
</body>
</html>
